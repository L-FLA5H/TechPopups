<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechPopups · 技巧面板</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --card:#22262f; --card-on:#26343f;
    --line:#2e3440; --txt:#e6e9ef; --dim:#8b93a3;
    --accent:#3FBEEF; --on:#4ade80; --off:#5b6270;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:10px 20px 0}
  h1{margin:0 0 2px;font-size:16px;font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px}
  .tabs{display:flex;gap:2px;margin-top:8px}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;
       border-radius:8px 8px 0 0;padding:6px 16px;font-size:13px;color:var(--dim);
       cursor:pointer;position:relative;top:1px}
  .tab:hover{color:var(--txt)}
  .tab.on{background:var(--bg);border-color:var(--line);color:var(--accent);
          border-bottom-color:var(--bg)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);
         border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  input[type=search]{background:var(--card);border:1px solid var(--line);
         border-radius:6px;padding:6px 10px;color:var(--txt);font-size:12px;
         min-width:180px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  main{padding:12px 20px 50px}
  main[hidden]{display:none}
  /* ==== 技巧版式 ====
     一块固定大小的画布，卡片按注册表给的 x / y 绝对定位。
     位置是手工摆出来的（上下左右都有讲究：同一列是一族、同一行是并排的几种），
     所以这里**不做任何自动排版**；窗口不够宽时整块画布等比缩小。 */
  .hint{background:#1d2430;border:1px solid #2f4256;color:#a9c4d8;border-radius:7px;
        font-size:12px;line-height:1.7;padding:8px 12px;margin:0 0 12px}
  .hint b{color:#e6e9ef}
  .boardwrap{position:relative;width:100%}
  .board{position:absolute;left:0;top:0;transform-origin:0 0;
         border:1px dashed var(--line);border-radius:10px;
         background-color:#151821;
         background-image:linear-gradient(#1b1f28 1px,transparent 1px),
                          linear-gradient(90deg,#1b1f28 1px,transparent 1px);
         background-size:20px 20px}
  .sechd{position:absolute;font-size:13px;font-weight:700;color:var(--txt);
         letter-spacing:.06em;white-space:nowrap;
         display:flex;align-items:baseline;gap:8px}
  .sechd .cnt{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:0}
  /* 卡片高度定死，有没有别名都一样高；左侧色条按技巧原分类上色 */
  .card{position:absolute;width:236px;height:56px;box-sizing:border-box;
        display:flex;flex-direction:column;justify-content:center;
        padding:0 11px;
        background:var(--card);border:1px solid var(--line);
        border-left:3px solid var(--cat,#3d444f);border-radius:8px;
        cursor:pointer;user-select:none;
        transition:border-color .12s,background .12s,opacity .12s}
  .card:hover{border-color:var(--accent)}
  .card.on{background:var(--card-on);border-color:#31556b}
  /* 搜索时：命中的亮、其余暗，版面不动 */
  .card.dim{opacity:.14}
  .card.hit{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .card .top{display:flex;align-items:baseline;gap:6px}
  .card .n{font-size:13px;font-weight:600;flex:1;min-width:0;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{font-size:10px;color:var(--off);flex:none}
  .card.on .tag{color:var(--on)}
  /* 别名缩到正名下面，小一号；没有别名时这里空着，高度不变 */
  .card .al{font-size:10px;color:var(--dim);line-height:1.3;margin-top:2px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.on .al{color:#9fb0c4}

  /* ==== 外观页：左设置 · 右预览，一屏放下 ==== */
  #tab-look{height:calc(100vh - 88px);overflow:hidden;padding-bottom:44px}
  .lookgrid{display:grid;grid-template-columns:minmax(520px,1fr) 640px;
            gap:18px;align-items:start;height:100%}
  .settings{columns:2;column-gap:14px}
  .settings section{break-inside:avoid;margin-bottom:12px}
  .knob{background:var(--card);border:1px solid var(--line);border-radius:7px;
        padding:5px 9px;margin-bottom:6px}
  .knob .r{display:flex;align-items:center;gap:8px}
  .knob .lbl{flex:none;width:88px;font-size:12px;color:var(--txt);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .knob .val{flex:none;width:58px;text-align:right;font-size:12px;color:var(--accent)}
  .knob input[type=range]{flex:1;min-width:0;height:22px;accent-color:var(--accent)}
  .knob .row{display:flex;gap:5px;margin-left:auto}
  .knob .row button{padding:3px 8px;font-size:11px}
  .knob .row button.sel{background:var(--card-on);border-color:#31556b;color:var(--on)}
  .sw{display:inline-flex;align-items:center;margin-left:auto;cursor:pointer;
      user-select:none;flex:none}
  .sw i{width:30px;height:16px;border-radius:8px;background:var(--off);position:relative;
        transition:background .15s;flex:none}
  .sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
        border-radius:50%;background:#fff;transition:transform .15s}
  .sw.on i{background:var(--on)}
  .sw.on i::after{transform:translateX(14px)}
  input.cpick{width:70px;height:24px;margin-left:auto;padding:2px;cursor:pointer;
        background:var(--card);border:1px solid var(--line);border-radius:5px}
  .ghead{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.08em;
         margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .ghead::after{content:"";flex:1;height:1px;background:var(--line)}
  .expnote{background:#2b2416;border:1px solid #6b5524;color:#e8c268;
           border-radius:6px;font-size:11px;line-height:1.6;padding:6px 9px;
           margin-bottom:6px}
  /* 开关关掉的分组：子项灰掉、禁用；分组里那个开关本身保持可点 */
  .koff .knob:not(.master){opacity:.38}
  .koff .knob:not(.master) input[type=range],
  .koff .knob:not(.master) .sw,
  .koff .knob:not(.master) .row{pointer-events:none}

  /* ==== 预览（右上角）====
     舞台坐标 = 1920x1080 的全屏幕空间，1 单位 = 1 屏幕像素；
     背景就是一张真实的游戏截图，所以「框」的相对大小是真的。 */
  .pvcol{position:sticky;top:0}
  #pvfit{width:100%;position:relative}
  #pvstage{position:relative;width:1920px;height:1080px;overflow:hidden;
           border:1px solid var(--line);border-radius:8px;
           transform-origin:top left;background:#141821}
  #pvbg{position:absolute;inset:0;width:1920px;height:1080px;display:block}
  #pvmark{position:absolute;width:48px;height:66px;border:2px dashed rgba(255,255,255,.55);
          border-radius:4px;pointer-events:none}
  /* 底色（rgba 的 alpha = 背景透明度）+ 毛玻璃模糊（独立开关，全强度） */
  .pill{position:absolute;left:0;top:0;
        display:flex;align-items:center;justify-content:center;
        box-sizing:content-box;
        border-radius:999px;white-space:nowrap;font-weight:700;line-height:1;
        background:rgba(26,29,38,.86);color:#fff;
        border:0;box-shadow:none;opacity:0;
        backdrop-filter:blur(6px) saturate(1.15);
        -webkit-backdrop-filter:blur(6px) saturate(1.15)}
  .pill .ic{display:block;border-radius:50%;flex:none;overflow:hidden;background:#1a1d26}
  .pill .ic img{display:block;width:100%;height:100%}
  .pill .tx{display:flex;align-items:center;flex:none}
  /* 每个字母占的宽度 = 字体文件里的 XAdvance，所以才跟游戏里一样宽 */
  .pill .tx i{display:inline-block;flex:none;font-style:normal;text-align:center;
          -webkit-text-stroke:1.2px #000;paint-order:stroke fill}
  .pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
  .pvbar button{padding:3px 10px;font-size:11px}
  .pvbar button.sel{background:var(--card-on);border-color:#31556b;color:var(--on)}

  /* ==== 特写预览（技巧框本体的放大镜头）==== */
  #pvfit2{width:100%;position:relative;margin-top:10px}
  #pvstage2{position:relative;width:960px;height:420px;overflow:hidden;
            border:1px solid var(--line);border-radius:8px;
            transform-origin:top left;background:#141821}
  #pvbg2{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;
         transform-origin:0 0}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
         border-top:1px solid var(--line);padding:6px 20px;font-size:11px;
         color:var(--dim);display:flex;justify-content:space-between;gap:12px}
  #stat{color:var(--dim)}
  .warn{color:#d0884a}
  @media (max-width:1240px){
    /* 窗口太窄时退回上下排，允许滚动（紧凑排版是给正常宽度用的） */
    #tab-look{height:auto;overflow:visible}
    .lookgrid{grid-template-columns:1fr}
    .settings{columns:2}
  }
</style>
</head>
<body>
<header>
  <h1>TechPopups · <span>技巧面板</span></h1>
  <div class="sub">改动会直接写回 Mod 设置 · 只在游戏内按屏幕刷新时生效</div>
  <div class="tabs">
    <button class="tab on" data-tab="tech">技巧</button>
    <button class="tab" data-tab="look">外观</button>
  </div>
</header>

<main id="tab-tech">
  <div class="bar">
    <input type="search" id="q" placeholder="搜技巧名 / 中文别名…">
    <button id="all">全部启用</button>
    <button id="none">全部停用</button>
    <button id="save">立即保存</button>
  </div>
  <div class="hint">
    · 版面位置是排好的 —— <b>点一下卡片</b>决定要不要显示这个技巧
  </div>
  <div id="main"><div class="sub">正在读取…</div></div>
</main>

<main id="tab-look" hidden>
  <div class="lookgrid">
    <div id="vbody" class="settings"><div class="sub">正在读取…</div></div>

      <section>

<script>
// 分组不在这里写死：注册表按「大组 (sec) → 族 (grp) → 条目」的顺序输出，
// 面板顺着切开就行。顺序和分组都在 TechRegistry.Build() 里维护。

const GROUPS = ["外观","边框","阴影","时长","毛玻璃（实验性）"];
// 各分组的总开关：关掉时整组灰掉（开关本身保持可点）
const GROUP_TOGGLE = {
  "边框":"popup.outline",
  "阴影":"popup.shadow",
  "毛玻璃（实验性）":"popup.bluron"
};

let data = {techs: []};
let vis  = {visual: []};
let visBuilt = false;
let filter = "";

// 刚点下去、游戏那边还没确认的开关（id -> {on, at}）。这页每 1.5 秒重新拉一次数据，
// 而游戏真正写设置要等下一帧主线程处理，中间这段时间拉回来的还是旧值 ——
// 不记住本地这一下，卡片就会自己弹回去，看起来像「点了没用」。
const pending = {};
// 上一次画出来的版面结构（条目 + 位置 + 名字）。只比这个：结构没变就只刷新开关外观，
// 不重建 DOM —— 重建会把手指正按着的那张卡换掉，mousedown 与 mouseup 之间元素一换，
// 浏览器就不派发 click 了（这是「有时候点了没反应」的第二个原因）。
let boardSig = "";

function techSig(list){
  return list.map(t => t.id + "@" + t.x + "," + t.y + "|" + t.name + "|" + (t.alias || "")).join(";");
}

async function load(){
  let j;
  try{
    const r = await fetch("/techs", {cache:"no-store"});
    j = await r.json();
  }catch(e){
    document.getElementById("stat").innerHTML =
      '<span class="warn">读不到数据 —— 游戏开着吗？</span>';
    return;
  }
  if(!j || !Array.isArray(j.techs)) return;

  // 服务端跟上了就把待确认项撤掉；还没跟上就保住用户点出来的样子（最多 5 秒）
  const now = Date.now();
  for(const t of j.techs){
    const p = pending[t.id];
    if(!p) continue;
    if(t.on === p.on || now - p.at > 5000) delete pending[t.id];
    else t.on = p.on;
  }

  const sig = techSig(j.techs);
  data = j;
  if(sig !== boardSig) render();   // 版面结构变了才重建
  else syncStates();               // 否则只把开关状态刷一遍，DOM 一个都不动
  if(!visBuilt) loadVisual();
}

/* ---------- 页签 ---------- */
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    document.getElementById("tab-tech").hidden = t.dataset.tab !== "tech";
    document.getElementById("tab-look").hidden = t.dataset.tab !== "look";
    if(t.dataset.tab === "look") loadVisual();
    fitStage();
  });
});

/* ---------- 外观旋钮 ---------- */
/* 滑条拖动时：先写进 live（预览下一帧就用到），再节流地 POST 给游戏。
   服务器值只在打开面板时读一次，之后单向往服务器写，避免互相覆盖。 */

const live = {};

function byKey(k){ return (vis.visual || []).find(x => x.key === k); }

const FALLBACK = {
  "popup.scale":100, "popup.offset":32, "popup.mode":0, "popup.perchar":1,
  "popup.edgemargin":40, "popup.glasstrans":30,
  "popup.bgr":26, "popup.bgg":29, "popup.bgb":38,
  "popup.outline":1, "popup.outlinew":2, "popup.outlinea":55,
  "popup.outliner":0, "popup.outlineg":0, "popup.outlineb":0,
  "popup.shadow":1, "popup.shadowx":1, "popup.shadowy":3, "popup.shadowa":32,
  "popup.shadowblur":0,
  "popup.shadowr":0, "popup.shadowg":0, "popup.shadowb":0,
  "popup.bluron":0, "popup.blur":0,
  "timing.hold":140, "timing.fadein":22, "timing.fadeout":45
};
function val(k){
  if(k in live) return live[k];
  const x = byKey(k);
  if(x) return Number(x.value);
  return (k in FALLBACK) ? FALLBACK[k] : 0;
}

async function loadVisual(){
  try{
    const r = await fetch("/visual", {cache:"no-store"});
    vis = await r.json();
  }catch(e){ /* 读不到就用默认值继续画预览，不能让预览空白 */ }
  renderVisual();
  visBuilt = vis.visual && vis.visual.length > 0;
}

/* RGB 三连滑条：r/g/b 三个键合并成一张卡 */
const RGB_SETS = [
  {base:"popup.bg",     label:"背景颜色", group:"外观"},
  {base:"popup.outline",label:"边框颜色", group:"边框"},
  {base:"popup.shadow", label:"阴影颜色", group:"阴影"}
];
const RGB_KEYS = new Set();
RGB_SETS.forEach(s => ["r","g","b"].forEach(c => RGB_KEYS.add(s.base + c)));

function renderVisual(){
  const box = document.getElementById("vbody");
  if(!vis.visual || !vis.visual.length){
    box.innerHTML = '<div class="sub warn">读不到外观设置（用的是 Mod 的默认值，'
                  + '右边预览仍然可以看）</div>';
    return;
  }

  const order = GROUPS.slice();
  for(const k of vis.visual) if(order.indexOf(k.group) < 0) order.push(k.group);

  let html = "";
  for(const g of order){
    const rows = vis.visual.filter(k => k.group === g && !RGB_KEYS.has(k.key));
    const rgb = RGB_SETS.filter(s => s.group === g
                                   && (byKey(s.base+"r") || byKey(s.base+"g") || byKey(s.base+"b")));
    if(!rows.length && !rgb.length) continue;
    html += `<section data-group="${esc(g)}"><div class="ghead">${esc(g)}</div>`;
    for(const k of rows) html += knobHtml(k);
    for(const s of rgb) html += rgbHtml(s);
    if(g.indexOf("实验性") >= 0){
      html += '<div class="expnote">⚠ 实验性功能：尚不完善，且可能增大性能占用。'
            + '建议把「模糊程度」调高以获得更佳体验。</div>';
    }
    html += "</section>";
  }
  box.innerHTML = html;

  // 滑条：input 时立刻进 live（预览下一帧生效）+ 更新数字与色块，节流 POST
  box.querySelectorAll("input[type=range]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.key;
      live[key] = Number(el.value);
      const vd = document.getElementById("v_" + css(key));
      if(vd) vd.textContent = el.value + unitOf(key);
      queueSend(key, el.value);
    });
  });
  box.querySelectorAll("input[type=color]").forEach(el => {
    el.addEventListener("input", () => {
      const base = el.dataset.base;
      const n = parseInt(el.value.slice(1), 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      live[base+"r"] = r; live[base+"g"] = g; live[base+"b"] = b;
      const vd = document.getElementById("v_" + css(base));
      if(vd) vd.textContent = el.value;
      queueSend(base+"r", r); queueSend(base+"g", g); queueSend(base+"b", b);
    });
  });
  box.querySelectorAll(".sw").forEach(el => {
    el.addEventListener("click", () => {
      const next = el.classList.contains("on") ? 0 : 1;
      el.classList.toggle("on", next === 1);
      const word = switchWord(el.dataset.key, next === 1);
      el.querySelector("span").textContent = word;
      const vd = document.getElementById("v_" + css(el.dataset.key));
      if(vd) vd.textContent = word;
      live[el.dataset.key] = next;
      queueSend(el.dataset.key, next);
      applyGrey();
    });
  });
  box.querySelectorAll(".row").forEach(row => {
    row.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        row.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        const vd = document.getElementById("v_" + css(row.dataset.key));
        if(vd) vd.textContent = b.textContent;
        live[row.dataset.key] = Number(b.dataset.i);
        queueSend(row.dataset.key, b.dataset.i);
      });
    });
  });
  applyGrey();
}

/* 开关关掉的分组：整组灰掉（开关本身除外） */
function applyGrey(){
  document.querySelectorAll("#vbody section").forEach(sec => {
    const key = GROUP_TOGGLE[sec.dataset.group];
    sec.classList.toggle("koff", !!key && !val(key));
  });
}

const sendTimers = {};
function queueSend(key, value){
  clearTimeout(sendTimers[key]);
  sendTimers[key] = setTimeout(() => sendVisual(key, value), 120);
}

function switchWord(key, on){
  if(key === "popup.perchar") return on ? "逐字摊入" : "整行出现";
  return on ? "开" : "关";
}

function knobHtml(k){
  const lbl = '<span class="lbl">' + esc(k.label) + '</span>';
  const id  = "v_" + css(k.key);
  const master = (GROUP_TOGGLE[k.group] === k.key) ? " master" : "";
  if(k.kind === "range"){
    return `<div class="knob${master}"><div class="r">${lbl}`
         + `<input type="range" min="${k.min}" max="${k.max}" value="${k.value}"`
         + ` data-key="${esc(k.key)}"><b class="val" id="${id}">${k.value}${esc(k.unit)}</b></div></div>`;
  }
  if(k.kind === "bool"){
    const word = switchWord(k.key, !!k.value);
    return `<div class="knob${master}"><div class="r">${lbl}`
         + `<b class="val" id="${id}">${word}</b>`
         + `<label class="sw ${k.value?"on":""}" data-key="${esc(k.key)}"><i></i>`
         + `<span>${word}</span></label></div></div>`;
  }
  const opts = k.options || [];
  let cells = "";
  opts.forEach((o,i) => {
    cells += `<button class="${i===k.value?"sel":""}" data-i="${i}">${esc(o)}</button>`;
  });
  return `<div class="knob${master}"><div class="r">${lbl}`
       + `<b class="val" id="${id}">${esc(opts[k.value]||k.value)}</b>`
       + `<div class="row" data-key="${esc(k.key)}">${cells}</div></div></div>`;
}

function rgbHtml(s){
  const hex = n => Number(n).toString(16).padStart(2, "0");
  const value = "#" + hex(val(s.base+"r")) + hex(val(s.base+"g")) + hex(val(s.base+"b"));
  return `<div class="knob"><div class="r"><span class="lbl">${esc(s.label)}</span>`
       + `<input type="color" class="cpick" value="${value}" data-base="${esc(s.base)}">`
       + `<b class="val" id="v_${css(s.base)}">${value}</b></div></div>`;
}

function css(key){ return key.replace(/\./g, "_"); }
function unitOf(key){
  const k = (vis.visual || []).find(x => x.key === key);
  return k ? (k.unit || "") : "";
}

/* ==================================================================
   实时预览
   ------------------------------------------------------------------
   量纲 = 1920x1080 的全屏幕空间（1 世界像素 = 6 屏幕像素），
   背景就是一张真的游戏截图，玩家站在画面中央的草台上。

     胶囊尺寸   文字高 = 76 * 0.55 * 0.73 * scale        （76 = fnt lineHeight）
                文字宽 = ΣXAdvance * 0.55 * 0.73 * scale
                内边距 = 5 * scale，图标槽 = 文字高 + 内边距
     位置       胶囊底边 = 玩家中心 - LabelOffsetY
     进场       alpha = SineOut(Anim)，下坠 30*scale，尺寸 0.86 → 1（BackOut）
     出场       alpha = 1 - CubeIn(p)，上飘 12*scale，收缩 6%
     逐字       45% 的时间把字母从左到右排开，每个字母自己做 BackOut 弹出

   同一套几何画两遍：全景（右上，跟游戏里一样挂在玩家头顶）
   和特写（下方，放大 1.8 倍只看框本体）。
   ================================================================== */

const FONT_LINE = 76;
const TEXTSZ    = 0.55 * 0.73;
const TEXT_FS   = 64;
const PAD_UNIT  = 5;
const LABEL     = "Demodash";
const ADV_MAP   = {D:48,e:36,m:57,o:38,d:40,a:37,s:29,h:39};
const ADV_FALLBACK = 38;
const advOf = c => (c in ADV_MAP) ? ADV_MAP[c] : ADV_FALLBACK;
const ADV = [...LABEL].reduce((a, c) => a + advOf(c), 0);
const LABEL_DROP  = 30;
const EXIT_RISE   = 12;
const EXIT_SHRINK = 0.06;
const POP_START   = 0.86;
const STAGGER     = 0.45;
const CHAR_POP    = 0.45;
const CHAR_RISE   = 5;
const REST        = 1.0;          // 预览专用：消失后停一下再重播

// 全景舞台：玩家站在背景截图中央的草台上
const PLAYER_X  = 960;
const PLAYER_CY = 758;
// 特写舞台：镜头中心对准玩家，放大倍数
const ZOOM2_W = 960, ZOOM2_H = 420, ZOOM2 = 1.8;
const CAM2_X = 480, CAM2_Y = 235;

const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const ease = {
  sineOut: t => Math.sin(t * Math.PI / 2),
  cubeOut: t => 1 - Math.pow(1 - t, 3),
  cubeIn : t => t * t * t,
  backOut: t => { const p = t - 1; return 1 + 2.70158 * p * p * p + 1.70158 * p * p; }
};

function charLocal(overall, i, n){
  if(n <= 1) return clamp01(overall);
  const step = STAGGER / (n - 1);
  const dur  = 1 - STAGGER;
  if(dur <= 0) return clamp01(overall - i * step);
  return clamp01((overall - i * step) / dur);
}

// 舞台整体缩放
const STAGE_W = 1920, STAGE_H = 1080;
function fitStage(){
  const fit = document.getElementById("pvfit");
  const stage = document.getElementById("pvstage");
  if(fit && stage){
    const avail = fit.clientWidth || 640;
    const k = avail / STAGE_W;
    stage.style.transform = "scale(" + k + ")";
    fit.style.height = (STAGE_H * k) + "px";
  }
  const fit2 = document.getElementById("pvfit2");
  const stage2 = document.getElementById("pvstage2");
  if(fit2 && stage2){
    const avail = fit2.clientWidth || 640;
    const k = avail / ZOOM2_W;
    stage2.style.transform = "scale(" + k + ")";
    fit2.style.height = (ZOOM2_H * k) + "px";
  }
}
window.addEventListener("resize", fitStage);

function buildLetters(txId){
  const tx = document.getElementById(txId);
  tx.innerHTML = "";
  const out = [];
  for(const ch of LABEL){
    const s = document.createElement("i");
    s.textContent = ch;
    s.dataset.adv = advOf(ch);
    tx.appendChild(s);
    out.push(s);
  }
  return out;
}

let paused = false, startedAt = performance.now(), pausedU = 0;
document.getElementById("pvreplay").addEventListener("click", () => {
  startedAt = performance.now();
});
const pauseBtn = document.getElementById("pvpause");
pauseBtn.addEventListener("click", () => {
  if(!paused){
    const fi = Math.max(0.05, val("timing.fadein") / 100);
    const ho = Math.max(0,    val("timing.hold") / 100);
    const fo = Math.max(0.05, val("timing.fadeout") / 100);
    pausedU = ((performance.now() - startedAt) / 1000) % (fi + ho + fo + REST);
    paused = true;
    pauseBtn.textContent = "继续";
  } else {
    paused = false;
    startedAt = performance.now();
    pauseBtn.textContent = "暂停";
  }
  pauseBtn.classList.toggle("sel", paused);
});

// 每帧共用的几何与外观
function pillState(now){
  const scale = val("popup.scale") / 100;
  const textH = FONT_LINE * TEXTSZ * scale;
  const textW = ADV * TEXTSZ * scale;
  const pad   = PAD_UNIT * scale;
  const mode  = val("popup.mode");
  const iconW = (mode === 1) ? 0 : textH + pad;
  const pillW = (mode === 2) ? (textH + pad * 2) : (textW + iconW + pad * 2);
  const pillH = textH + pad * 2;

  const fi = Math.max(0.05, val("timing.fadein") / 100);
  const ho = Math.max(0,    val("timing.hold") / 100);
  const fo = Math.max(0.05, val("timing.fadeout") / 100);
  const cycle = fi + ho + fo + REST;
  const u = paused ? pausedU : ((now - startedAt) / 1000) % cycle;

  let anim = 1, exitP = 0, alpha = 1, exiting = false;
  if(u < fi){ anim = u / fi; alpha = ease.sineOut(anim); }
  else if(u < fi + ho){ anim = 1; alpha = 1; }
  else if(u < fi + ho + fo){ exitP = (u - fi - ho) / fo; alpha = 1 - ease.cubeIn(exitP); exiting = true; }
  else { alpha = 0; exitP = 1; exiting = true; }

  const pop = (anim < 1)
      ? (POP_START + (1 - POP_START) * ease.backOut(anim))
      : (1 - EXIT_SHRINK * ease.cubeIn(exitP));

  const offsetY = val("popup.offset");
  const drop = LABEL_DROP * scale * (1 - ease.cubeOut(anim));
  const rise = EXIT_RISE  * scale * ease.cubeOut(exitP);

  return {scale, textH, textW, pad, mode, pillW, pillH, fi, ho, fo,
          anim, exitP, alpha, exiting, pop, offsetY, drop, rise};
}

function stylePill(pillEl, ls, st, anchorX, anchorBottom, zoom){
  const fullW = st.pillW * st.pop * zoom;
  const fullH = st.pillH * st.pop * zoom;
  const padK  = st.pad * st.pop * zoom;
  const innerW = Math.max(0, fullW - padK * 2);
  const innerH = Math.max(0, fullH - padK * 2);
  const anchorY = anchorBottom - st.offsetY * zoom - st.drop * st.scale * zoom - st.rise * st.scale * zoom;

  const el = pillEl;
  el.style.width   = innerW.toFixed(1) + "px";
  el.style.height  = innerH.toFixed(1) + "px";
  el.style.padding = padK.toFixed(1) + "px";
  el.style.left    = (anchorX - fullW / 2).toFixed(1) + "px";
  el.style.top     = (anchorY - fullH).toFixed(1) + "px";
  el.style.opacity = st.alpha.toFixed(3);
  el.style.fontSize = (TEXT_FS * TEXTSZ * st.scale * st.pop * zoom).toFixed(1) + "px";

  // 图标（槽宽 = 文字高 + 内边距）
  const ic = el.querySelector(".ic");
  if(st.mode === 1){
    ic.style.display = "none";
  } else {
    ic.style.display = "block";
    ic.style.width = ic.style.height = (st.textH * st.pop * zoom).toFixed(1) + "px";
    ic.style.marginRight = (st.mode === 2 ? 0 : padK).toFixed(1) + "px";
  }
  // 只显示图标时，文字整个藏掉
  const tx = el.querySelector(".tx");
  tx.style.display = (st.mode === 2) ? "none" : "flex";

  // 逐字
  const perChar = !!val("popup.perchar");
  for(let i = 0; i < ls.length; i++){
    const e = ls[i];
    e.style.width = (Number(e.dataset.adv) * TEXTSZ * st.scale * st.pop * zoom).toFixed(1) + "px";
    let local;
    if(perChar){
      if(st.anim < 1 && !st.exiting)      local = charLocal(st.anim, i, ls.length);
      else if(st.exiting)                 local = 1 - charLocal(st.exitP, i, ls.length);
      else                                local = 1;
    } else {
      local = 1;
    }
    if(local <= 0){ e.style.visibility = "hidden"; continue; }
    e.style.visibility = "visible";
    e.style.opacity = ease.sineOut(local).toFixed(3);
    e.style.transform = "translateY(" + (-(1 - local) * CHAR_RISE * st.scale * zoom).toFixed(1)
                       + "px) scale(" + (CHAR_POP + (1 - CHAR_POP) * ease.backOut(local)).toFixed(3) + ")";
  }

  // 背景颜色 + 背景透明度（这就是玻璃本体）；毛玻璃模糊是叠在上面的独立开关，
  // 全强度绘制，所以透明度 100 时你看到的仍是纯粹的霜。
  const t = Math.max(0, Math.min(100, val("popup.glasstrans")));
  const bodyA = Math.max(0, 1 - t / 100);
  el.style.background = "rgba(" + val("popup.bgr") + "," + val("popup.bgg") + ","
                      + val("popup.bgb") + "," + bodyA.toFixed(3) + ")";
  if(val("popup.bluron")){
    const pct = Math.max(0, Math.min(100, val("popup.blur")));
    const radius = 1 + Math.round(pct * 4 / 100);
    el.style.backdropFilter = "blur(" + (radius * 6 * zoom).toFixed(1) + "px)";
    el.style.webkitBackdropFilter = el.style.backdropFilter;
  } else {
    el.style.backdropFilter = "none";
    el.style.webkitBackdropFilter = "none";
  }

  // 边框 / 阴影：颜色、浓度、模糊都独立于背景
  const shadows = [];
  if(val("popup.shadow")){
    const a = Math.max(0, Math.min(100, val("popup.shadowa"))) / 100;
    if(a > 0){
      shadows.push((val("popup.shadowx") * zoom).toFixed(1) + "px "
                 + (val("popup.shadowy") * zoom).toFixed(1) + "px "
                 + (val("popup.shadowblur") * zoom).toFixed(1) + "px "
                 + "rgba(" + val("popup.shadowr") + "," + val("popup.shadowg") + ","
                 + val("popup.shadowb") + "," + a.toFixed(2) + ")");
    }
  }
  if(val("popup.outline")){
    const ow = Math.max(0, Math.min(8, val("popup.outlinew")));
    const a  = Math.max(0, Math.min(100, val("popup.outlinea"))) / 100;
    if(ow > 0 && a > 0){
      shadows.push("0 0 0 " + (ow * zoom).toFixed(1) + "px "
                 + "rgba(" + val("popup.outliner") + "," + val("popup.outlineg") + ","
                 + val("popup.outlineb") + "," + a.toFixed(2) + ")");
    }
  }
  el.style.boxShadow = shadows.length ? shadows.join(", ") : "none";
}

function frame(now){
  requestAnimationFrame(frame);
  const stage = document.getElementById("pvstage");
  const pill1 = document.getElementById("pvpill");
  const pill2 = document.getElementById("pvpill2");
  if(!stage || !pill1 || stage.offsetParent === null) return;   // 页签没打开就别算

  const st = pillState(paused ? pausedU * 1000 + startedAt : now);

  // 全景：框挂在玩家头顶
  stylePill(pill1, letters1, st, PLAYER_X, PLAYER_CY, 1);
  const mark = document.getElementById("pvmark");
  if(mark){
    mark.style.left = (PLAYER_X - 24) + "px";
    mark.style.top  = (PLAYER_CY - 33) + "px";
  }

  // 特写：镜头对准玩家，放大 1.8 倍
  const bg2 = document.getElementById("pvbg2");
  if(bg2){
    bg2.style.transform = "translate(" + (CAM2_X - PLAYER_X * ZOOM2).toFixed(1) + "px,"
                                        + (CAM2_Y - PLAYER_CY * ZOOM2).toFixed(1) + "px)"
                        + " scale(" + ZOOM2 + ")";
  }
  stylePill(pill2, letters2, st, CAM2_X, CAM2_Y + 10, ZOOM2);

  const label = document.getElementById("pvwhen");
  if(label){
    label.textContent = "进场 " + st.fi.toFixed(2) + "s · 停留 " + st.ho.toFixed(2)
                      + "s · 出场 " + st.fo.toFixed(2) + "s";
  }
}

async function sendVisual(key, value){
  try{
    await fetch(`/setvisual?key=${encodeURIComponent(key)}&value=${value}`, {method:"POST"});
  }catch(e){}
}

/* ---------- 技巧版式 ---------- */
const BOX_W = 236;      // card width, must match the CSS
const BOARD_PAD = 20;

function render(){
  const main = document.getElementById("main");
  const q = filter;
  const hit = t => !q || t.name.toLowerCase().includes(q)
                     || (t.alias || "").toLowerCase().includes(q);
  updateStat();

  if(!data.techs.length){ main.innerHTML = '<div class="sub">还没有技巧数据</div>'; return; }

  // 三个大组，按注册表的顺序（冲刺技巧 / 无冲技巧 / 实体技巧）
  const secs = [];
  for(const t of data.techs){
    let s = secs[secs.length - 1];
    if(!s || s.name !== t.sec){ s = {name: t.sec, items: []}; secs.push(s); }
    s.items.push(t);
  }

  // 画布要多大：包住最右下角那张卡，再加一点余量
  let w = 0, h = 0;
  for(const t of data.techs){ w = Math.max(w, t.x); h = Math.max(h, t.y); }
  w += BOX_W + BOARD_PAD;
  h += 74 + BOARD_PAD;

  let html = "";
  for(const s of secs){
    // 标题摆在这一段最上面那张卡的左上方
    const y0 = Math.min(...s.items.map(t => t.y));
    const x0 = Math.min(...s.items.map(t => t.x));
    html += `<div class="sechd" style="left:${x0}px;top:${y0 - 36}px">`
          + `${esc(s.name)}<span class="cnt">${s.items.length} 项</span></div>`;
    for(const t of s.items){
      const cls = "card" + (t.on ? " on" : "") + (q ? (hit(t) ? " hit" : " dim") : "");
      // 卡片正面是正名，别名缩在下面 —— 颜色条取技巧自己的原分类
      html += `<div class="${cls}" data-id="${t.id}"`
            + ` style="left:${t.x}px;top:${t.y}px;--cat:${catColor(t.cat)}">`
            + `<div class="top"><span class="n">${esc(t.name)}</span>`
            + `<span class="tag">${t.on ? "已启用" : "已停用"}</span></div>`
            + `<div class="al">${esc(t.alias || "")}</div></div>`;
    }
  }

  main.innerHTML = `<div class="boardwrap" id="boardwrap">`
                 + `<div class="board" id="board" style="width:${w}px;height:${h}px">`
                 + html + `</div></div>`;
  main.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => toggle(el));
  });
  boardSig = techSig(data.techs);
  fit();
}

// 只更新卡片的开关外观（不重建 DOM）—— 重建会让正在进行的点击失效
function syncStates(){
  const byId = {};
  for(const t of data.techs) byId[t.id] = t;
  for(const el of document.querySelectorAll("#main .card")){
    const t = byId[el.dataset.id];
    if(t) paintCard(el, t);
  }
  updateStat();
}

function paintCard(el, t){
  el.classList.toggle("on", !!t.on);
  const tag = el.querySelector(".tag");     // 卡片上的状态文字
  if(tag) tag.textContent = t.on ? "已启用" : "已停用";
}

function updateStat(){
  const on = data.techs.filter(t => t.on).length;
  document.getElementById("stat").textContent =
    `共 ${data.techs.length} 项 · 当前启用 ${on} 项`;
}

// 整块画布等比缩放到可用宽度：版面永远是摆好的那个样子，只是小一点
function fit(){
  const wrap = document.getElementById("boardwrap");
  const board = document.getElementById("board");
  if(!wrap || !board) return;
  const native = parseFloat(board.style.width) || 1;
  const s = Math.min(1, (wrap.clientWidth || native) / native);
  board.style.transform = "scale(" + s + ")";
  wrap.style.height = (parseFloat(board.style.height) * s) + "px";
}

window.addEventListener("resize", fit);

// 技巧原分类 → 一个稳定的色相，给卡片左边的色条用
function catColor(s){
  let h = 0;
  for(const ch of String(s || "")) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return "hsl(" + h + ",52%,55%)";
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// 同一个开关可能挂着好几张卡（Wavedash / Hyper / Demohyper 都是 Hyper 那一个开关）。
// 动了其中一个要把同组的全动一起 —— 不然点完这张那张还显示旧状态，
// 再点上它就按旧状态取反，正好点反。
function switchGroup(t){
  if(!t) return [];
  return t.key ? data.techs.filter(x => x.key === t.key) : [t];
}

async function toggle(el){
  const id = el.dataset.id;
  const t = data.techs.find(x => x.id === id);
  if(!t) return;

  const group = switchGroup(t);
  const on = !t.on;
  // 先改本地状态再发请求：定时刷新拿到的还是旧值，靠 pending 才不会被刷回去
  for(const g of group){
    g.on = on;
    pending[g.id] = {on: on, at: Date.now()};
  }
  syncStates();

  try{
    const r = await fetch(`/set?id=${encodeURIComponent(id)}&on=${on?1:0}`, {method:"POST"});
    if(!r.ok) throw new Error("HTTP " + r.status);
  }catch(e){
    // 没发出去 / 被拒绝：整组退回原样，别留下一个跟游戏对不上的显示
    for(const g of group){
      delete pending[g.id];
      g.on = !on;
    }
    syncStates();
  }
}

async function setAll(on){
  const targets = data.techs.filter(t => t.on !== on);
  for(const t of targets){
    t.on = on;
    pending[t.id] = {on: on, at: Date.now()};
  }
  syncStates();
  for(const t of targets){
    try{ await fetch(`/set?id=${encodeURIComponent(t.id)}&on=${on?1:0}`, {method:"POST"}); }
    catch(e){}
  }
}

document.getElementById("q").addEventListener("input", e => {
  filter = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("all").addEventListener("click", () => setAll(true));
document.getElementById("none").addEventListener("click", () => setAll(false));
document.getElementById("save").addEventListener("click", async () => {
  try{ await fetch("/save", {method:"POST"}); }catch(e){}
});

let letters1 = buildLetters("pvtext");
let letters2 = buildLetters("pvtext2");
// 特写的背景 = 同一张截图，直接复用全景的数据 URI，不占双倍体积
document.getElementById("pvbg2").src = document.getElementById("pvbg").src;
fitStage();
requestAnimationFrame(frame);
load();
setInterval(load, 1500);
</script>
